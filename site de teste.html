<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre — Gestion des clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2420;
    --page:#F2F5F1;
    --page-alt:#E7ECE6;
    --spine:#1F3A34;
    --spine-light:#2C4E45;
    --brass:#C08A2E;
    --brass-light:#DDAE5C;
    --sage:#7A8B7F;
    --rust:#A6432F;
    --paper-line: rgba(31,58,52,0.08);
    --shadow: 0 8px 24px rgba(20,30,26,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- SPINE / SIDEBAR ---------- */
  .spine{
    width:340px;
    flex-shrink:0;
    background:var(--spine);
    color:#EDEFE9;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .spine::after{
    content:"";
    position:absolute;
    top:0; right:0; bottom:0;
    width:14px;
    background:linear-gradient(90deg, rgba(0,0,0,0.18), rgba(0,0,0,0));
  }
  .spine-header{
    padding:28px 26px 18px;
    border-bottom:1px solid rgba(237,239,233,0.12);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:0 0 4px;
  }
  .brand-mark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.01em;
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass-light);
  }
  .stats-row{
    display:flex;
    gap:14px;
    margin-top:16px;
  }
  .stat{
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(237,239,233,0.1);
    border-radius:6px;
    padding:10px 12px;
  }
  .stat-num{
    font-family:'Fraunces', serif;
    font-size:22px;
    line-height:1;
    color:#fff;
  }
  .stat-label{
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--sage);
    margin-top:4px;
  }

  .spine-controls{
    padding:18px 26px 10px;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(237,239,233,0.15);
    color:#fff;
    padding:10px 12px 10px 34px;
    border-radius:6px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
  }
  .search-wrap input::placeholder{ color:rgba(237,239,233,0.45); }
  .search-wrap input:focus{
    outline:2px solid var(--brass-light);
    outline-offset:1px;
    background:rgba(255,255,255,0.1);
  }
  .search-icon{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; opacity:0.55;
  }

  .status-tabs{
    display:flex;
    gap:6px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .status-tabs button{
    background:transparent;
    border:1px solid rgba(237,239,233,0.18);
    color:rgba(237,239,233,0.75);
    font-size:11.5px;
    padding:5px 10px;
    border-radius:999px;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    transition:all .15s ease;
  }
  .status-tabs button:hover{ border-color:var(--brass-light); color:#fff; }
  .status-tabs button.active{
    background:var(--brass);
    border-color:var(--brass);
    color:#1C2420;
    font-weight:600;
  }

  .add-btn{
    margin:14px 26px 4px;
    background:var(--brass);
    color:#1C2420;
    border:none;
    padding:10px 14px;
    border-radius:6px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease, transform .1s ease;
  }
  .add-btn:hover{ background:var(--brass-light); }
  .add-btn:active{ transform:scale(0.98); }
  .add-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  /* client list */
  .client-list{
    flex:1;
    overflow-y:auto;
    padding:8px 0 20px;
  }
  .list-empty{
    padding:30px 26px;
    color:var(--sage);
    font-size:13.5px;
    line-height:1.6;
  }
  .letter-group-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brass-light);
    padding:12px 26px 4px;
    letter-spacing:0.08em;
  }
  .client-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 26px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .12s ease, border-color .12s ease;
  }
  .client-item:hover{ background:rgba(255,255,255,0.05); }
  .client-item.selected{
    background:rgba(255,255,255,0.08);
    border-left-color:var(--brass);
  }
  .avatar{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--spine-light);
    border:1px solid rgba(237,239,233,0.15);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-size:13px;
    color:#fff;
    flex-shrink:0;
  }
  .client-item-text{ min-width:0; flex:1; }
  .client-item-name{
    font-size:14px;
    font-weight:500;
    color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .client-item-sub{
    font-size:12px;
    color:var(--sage);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dot{
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
  }
  .dot.prospect{ background:#C08A2E; }
  .dot.actif{ background:#6FA787; }
  .dot.inactif{ background:#7A8B7F; }

  /* alphabet rail */
  .alpha-rail{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    padding:6px 4px;
    background:rgba(0,0,0,0.15);
    flex-shrink:0;
  }
  .alpha-rail button{
    background:none;
    border:none;
    color:rgba(237,239,233,0.28);
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    width:18px;
    height:16px;
    cursor:default;
    border-radius:3px;
  }
  .alpha-rail button.has-match{
    color:rgba(237,239,233,0.75);
    cursor:pointer;
  }
  .alpha-rail button.has-match:hover{
    background:var(--brass);
    color:#1C2420;
  }

  .spine-flex{
    display:flex;
    flex:1;
    min-height:0;
  }

  /* ---------- MAIN PAGE ---------- */
  .page{
    flex:1;
    padding:44px 56px;
    overflow-y:auto;
    max-width:760px;
  }
  .empty-state{
    max-width:420px;
    margin-top:80px;
  }
  .empty-state .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--brass);
  }
  .empty-state h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:28px;
    margin:10px 0 12px;
    color:var(--spine);
  }
  .empty-state p{
    color:var(--sage);
    font-size:14.5px;
    line-height:1.7;
  }

  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding-bottom:18px;
    border-bottom:1px solid var(--paper-line);
    margin-bottom:28px;
  }
  .page-header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:6px;
    display:block;
  }
  .page-header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:32px;
    margin:0;
    color:var(--spine);
  }
  .page-actions{ display:flex; gap:10px; }
  .btn{
    border:none;
    padding:9px 16px;
    border-radius:6px;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--spine); color:#fff; }
  .btn-primary:hover{ background:var(--spine-light); }
  .btn-ghost{ background:transparent; color:var(--rust); border:1px solid rgba(166,67,47,0.3); }
  .btn-ghost:hover{ background:rgba(166,67,47,0.06); }
  .btn-outline{ background:transparent; color:var(--spine); border:1px solid var(--paper-line); }
  .btn-outline:hover{ border-color:var(--spine); }

  form.client-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 22px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full{ grid-column:1 / -1; }
  .field label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--sage);
    font-weight:600;
  }
  .field input, .field select, .field textarea{
    border:1px solid var(--paper-line);
    background:var(--page-alt);
    padding:10px 12px;
    border-radius:6px;
    font-size:14.5px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:90px; font-family:'IBM Plex Sans', sans-serif; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--brass);
    outline-offset:0;
    border-color:transparent;
  }
  .field-error{ font-size:12px; color:var(--rust); min-height:14px; }

  .form-footer{
    grid-column:1 / -1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-top:18px;
    border-top:1px solid var(--paper-line);
  }
  .meta-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--sage);
  }

  /* confirm delete inline */
  .confirm-bar{
    grid-column:1/-1;
    background:rgba(166,67,47,0.07);
    border:1px solid rgba(166,67,47,0.25);
    border-radius:6px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13.5px;
  }
  .confirm-bar .actions{ display:flex; gap:8px; }
  .confirm-bar button{
    border:none; padding:6px 12px; border-radius:5px; font-size:12.5px; cursor:pointer;
  }
  .confirm-yes{ background:var(--rust); color:#fff; }
  .confirm-no{ background:transparent; color:var(--ink); border:1px solid var(--paper-line) !important; }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--spine);
    color:#fff;
    padding:11px 20px;
    border-radius:8px;
    font-size:13.5px;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .spine{ width:100%; }
    .spine-flex{ max-height:44vh; }
    .page{ padding:28px 22px; max-width:none; }
    form.client-form{ grid-template-columns:1fr; }
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:rgba(0,0,0,0.15); border-radius:6px; }
</style>
</head>
<body>

<div class="app">
  <aside class="spine">
    <div class="spine-header">
      <div class="brand">
        <span class="brand-mark">Registre</span>
      </div>
      <div class="brand-sub">Carnet de clients</div>
      <div class="stats-row">
        <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-num" id="statActifs">0</div><div class="stat-label">Actifs</div></div>
        <div class="stat"><div class="stat-num" id="statProspects">0</div><div class="stat-label">Prospects</div></div>
      </div>
    </div>

    <div class="spine-controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#EDEFE9" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher un client…" autocomplete="off">
      </div>
      <div class="status-tabs" id="statusTabs">
        <button data-status="tous" class="active">Tous</button>
        <button data-status="actif">Actifs</button>
        <button data-status="prospect">Prospects</button>
        <button data-status="inactif">Inactifs</button>
      </div>
    </div>

    <button class="add-btn" id="addBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1C2420" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Ajouter un client
    </button>

    <div class="spine-flex">
      <div class="client-list" id="clientList"></div>
      <div class="alpha-rail" id="alphaRail"></div>
    </div>
  </aside>

  <main class="page" id="page">
    <div class="empty-state">
      <span class="eyebrow">Aucune fiche ouverte</span>
      <h2>Sélectionnez ou créez une fiche client</h2>
      <p>Choisissez un client dans le registre à gauche, ou cliquez sur « Ajouter un client » pour ouvrir une nouvelle fiche.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  let clients = [];
  let selectedId = null;
  let mode = null; // 'view' | 'edit' | 'new'
  let statusFilter = 'tous';
  let searchTerm = '';
  let pendingDeleteId = null;

  const clientListEl = document.getElementById('clientList');
  const pageEl = document.getElementById('page');
  const alphaRailEl = document.getElementById('alphaRail');
  const toastEl = document.getElementById('toast');
  const searchInput = document.getElementById('searchInput');
  const statusTabs = document.getElementById('statusTabs');
  const addBtn = document.getElementById('addBtn');

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

  function uid(){ return 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function initials(name){
    if(!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || name[0].toUpperCase();
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  async function loadClients(){
    try{
      const res = await window.storage.get('clients', false);
      clients = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      clients = [];
    }
    render();
  }

  async function saveClients(){
    try{
      const res = await window.storage.set('clients', JSON.stringify(clients), false);
      if(!res) console.error('Échec de la sauvegarde');
    }catch(e){
      console.error('Erreur de stockage', e);
    }
  }

  function filteredClients(){
    return clients
      .filter(c => statusFilter === 'tous' || c.statut === statusFilter)
      .filter(c => {
        if(!searchTerm) return true;
        const q = searchTerm.toLowerCase();
        return (c.nom||'').toLowerCase().includes(q) ||
               (c.entreprise||'').toLowerCase().includes(q) ||
               (c.email||'').toLowerCase().includes(q) ||
               (c.telephone||'').toLowerCase().includes(q);
      })
      .sort((a,b)=> (a.nom||'').localeCompare(b.nom||'', 'fr'));
  }

  function renderStats(){
    document.getElementById('statTotal').textContent = clients.length;
    document.getElementById('statActifs').textContent = clients.filter(c=>c.statut==='actif').length;
    document.getElementById('statProspects').textContent = clients.filter(c=>c.statut==='prospect').length;
  }

  function renderList(){
    const list = filteredClients();
    clientListEl.innerHTML = '';

    if(clients.length === 0){
      clientListEl.innerHTML = `<div class="list-empty">Le registre est vide. Ajoutez votre premier client pour commencer.</div>`;
    } else if(list.length === 0){
      clientListEl.innerHTML = `<div class="list-empty">Aucun client ne correspond à votre recherche.</div>`;
    } else {
      let currentLetter = '';
      list.forEach(c=>{
        const letter = (c.nom||'?')[0].toUpperCase();
        if(letter !== currentLetter){
          currentLetter = letter;
          const label = document.createElement('div');
          label.className = 'letter-group-label';
          label.textContent = letter;
          label.dataset.letterGroup = letter;
          clientListEl.appendChild(label);
        }
        const item = document.createElement('div');
        item.className = 'client-item' + (c.id === selectedId ? ' selected' : '');
        item.dataset.letter = letter;
        item.innerHTML = `
          <div class="avatar">${initials(c.nom)}</div>
          <div class="client-item-text">
            <div class="client-item-name">${escapeHtml(c.nom || 'Sans nom')}</div>
            <div class="client-item-sub">${escapeHtml(c.entreprise || c.telephone || '—')}</div>
          </div>
          <span class="dot ${c.statut||'prospect'}"></span>
        `;
        item.addEventListener('click', ()=>{ selectedId = c.id; mode='view'; render(); });
        clientListEl.appendChild(item);
      });
    }

    // alpha rail
    const presentLetters = new Set(list.map(c => (c.nom||'?')[0].toUpperCase()));
    alphaRailEl.innerHTML = '';
    ALPHABET.forEach(letter=>{
      const btn = document.createElement('button');
      btn.textContent = letter;
      if(presentLetters.has(letter)){
        btn.classList.add('has-match');
        btn.addEventListener('click', ()=>{
          const target = clientListEl.querySelector(`[data-letter-group="${letter}"]`);
          if(target) target.scrollIntoView({block:'start'});
        });
      }
      alphaRailEl.appendChild(btn);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderPage(){
    if(mode === 'new' || mode === 'edit'){
      renderForm();
      return;
    }
    if(mode === 'view'){
      const c = clients.find(x=>x.id===selectedId);
      if(!c){ mode=null; renderEmptyPage(); return; }
      renderDetail(c);
      return;
    }
    renderEmptyPage();
  }

  function renderEmptyPage(){
    pageEl.innerHTML = `
      <div class="empty-state">
        <span class="eyebrow">Aucune fiche ouverte</span>
        <h2>Sélectionnez ou créez une fiche client</h2>
        <p>Choisissez un client dans le registre à gauche, ou cliquez sur « Ajouter un client » pour ouvrir une nouvelle fiche.</p>
      </div>
    `;
  }

  function statusLabel(s){
    return {actif:'Actif', prospect:'Prospect', inactif:'Inactif'}[s] || 'Prospect';
  }

  function renderDetail(c){
    pageEl.innerHTML = `
      <div class="page-header">
        <div>
          <span class="eyebrow">${statusLabel(c.statut)} · Fiche client</span>
          <h1>${escapeHtml(c.nom || 'Sans nom')}</h1>
        </div>
        <div class="page-actions">
          <button class="btn btn-outline" id="editBtn">Modifier</button>
          <button class="btn btn-ghost" id="deleteBtn">Supprimer</button>
        </div>
      </div>
      <form class="client-form" style="pointer-events:none;">
        <div class="field"><label>Entreprise</label><div>${escapeHtml(c.entreprise) || '—'}</div></div>
        <div class="field"><label>Statut</label><div>${statusLabel(c.statut)}</div></div>
        <div class="field"><label>Téléphone</label><div>${escapeHtml(c.telephone) || '—'}</div></div>
        <div class="field"><label>Email</label><div>${escapeHtml(c.email) || '—'}</div></div>
        <div class="field full"><label>Adresse</label><div>${escapeHtml(c.adresse) || '—'}</div></div>
        <div class="field full"><label>Notes</label><div style="white-space:pre-wrap;">${escapeHtml(c.notes) || '—'}</div></div>
        <div class="form-footer" style="pointer-events:auto;">
          <span class="meta-note">Ajouté le ${c.dateAjout ? new Date(c.dateAjout).toLocaleDateString('fr-FR') : '—'}</span>
        </div>
        ${pendingDeleteId === c.id ? `
        <div class="confirm-bar" style="pointer-events:auto;">
          <span>Supprimer définitivement cette fiche ?</span>
          <div class="actions">
            <button type="button" class="confirm-no" id="cancelDelete">Annuler</button>
            <button type="button" class="confirm-yes" id="confirmDelete">Supprimer</button>
          </div>
        </div>` : ''}
      </form>
    `;
    document.getElementById('editBtn').addEventListener('click', ()=>{ mode='edit'; render(); });
    document.getElementById('deleteBtn').addEventListener('click', ()=>{ pendingDeleteId = c.id; renderPage(); });
    const cancelBtn = document.getElementById('cancelDelete');
    const confirmBtn = document.getElementById('confirmDelete');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ pendingDeleteId=null; renderPage(); });
    if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
      clients = clients.filter(x=>x.id!==c.id);
      pendingDeleteId=null; selectedId=null; mode=null;
      await saveClients();
      showToast('Client supprimé');
      render();
    });
  }

  function renderForm(){
    const isNew = mode === 'new';
    const c = isNew ? {nom:'',entreprise:'',telephone:'',email:'',adresse:'',statut:'prospect',notes:''} : clients.find(x=>x.id===selectedId);
    if(!c){ mode=null; renderEmptyPage(); return; }

    pageEl.innerHTML = `
      <div class="page-header">
        <div>
          <span class="eyebrow">${isNew ? 'Nouvelle fiche' : 'Modifier la fiche'}</span>
          <h1>${isNew ? 'Ajouter un client' : escapeHtml(c.nom || 'Sans nom')}</h1>
        </div>
      </div>
      <form class="client-form" id="clientForm" novalidate>
        <div class="field full">
          <label for="f_nom">Nom complet *</label>
          <input type="text" id="f_nom" value="${escapeHtml(c.nom)}" placeholder="Ex. Mariama Diallo">
          <div class="field-error" id="err_nom"></div>
        </div>
        <div class="field">
          <label for="f_entreprise">Entreprise</label>
          <input type="text" id="f_entreprise" value="${escapeHtml(c.entreprise)}" placeholder="Ex. Sonoco SARL">
        </div>
        <div class="field">
          <label for="f_statut">Statut</label>
          <select id="f_statut">
            <option value="prospect" ${c.statut==='prospect'?'selected':''}>Prospect</option>
            <option value="actif" ${c.statut==='actif'?'selected':''}>Actif</option>
            <option value="inactif" ${c.statut==='inactif'?'selected':''}>Inactif</option>
          </select>
        </div>
        <div class="field">
          <label for="f_telephone">Téléphone</label>
          <input type="text" id="f_telephone" value="${escapeHtml(c.telephone)}" placeholder="Ex. +224 6XX XX XX XX">
        </div>
        <div class="field">
          <label for="f_email">Email</label>
          <input type="email" id="f_email" value="${escapeHtml(c.email)}" placeholder="Ex. nom@exemple.com">
          <div class="field-error" id="err_email"></div>
        </div>
        <div class="field full">
          <label for="f_adresse">Adresse</label>
          <input type="text" id="f_adresse" value="${escapeHtml(c.adresse)}" placeholder="Ex. Kaloum, Conakry">
        </div>
        <div class="field full">
          <label for="f_notes">Notes</label>
          <textarea id="f_notes" placeholder="Historique, préférences, remarques…">${escapeHtml(c.notes)}</textarea>
        </div>
        <div class="form-footer">
          <button type="button" class="btn btn-outline" id="cancelForm">Annuler</button>
          <button type="submit" class="btn btn-primary">${isNew ? 'Créer la fiche' : 'Enregistrer'}</button>
        </div>
      </form>
    `;

    document.getElementById('cancelForm').addEventListener('click', ()=>{
      if(isNew){ mode=null; selectedId=null; } else { mode='view'; }
      render();
    });

    document.getElementById('clientForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const nom = document.getElementById('f_nom').value.trim();
      const email = document.getElementById('f_email').value.trim();
      let valid = true;
      document.getElementById('err_nom').textContent = '';
      document.getElementById('err_email').textContent = '';
      if(!nom){
        document.getElementById('err_nom').textContent = 'Le nom est obligatoire.';
        valid = false;
      }
      if(email && !/^\S+@\S+\.\S+$/.test(email)){
        document.getElementById('err_email').textContent = 'Adresse email invalide.';
        valid = false;
      }
      if(!valid) return;

      const data = {
        nom,
        entreprise: document.getElementById('f_entreprise').value.trim(),
        statut: document.getElementById('f_statut').value,
        telephone: document.getElementById('f_telephone').value.trim(),
        email,
        adresse: document.getElementById('f_adresse').value.trim(),
        notes: document.getElementById('f_notes').value.trim(),
      };

      if(isNew){
        const newClient = Object.assign({id: uid(), dateAjout: Date.now()}, data);
        clients.push(newClient);
        selectedId = newClient.id;
        showToast('Client ajouté');
      } else {
        Object.assign(c, data);
        showToast('Modifications enregistrées');
      }
      mode = 'view';
      await saveClients();
      render();
    });
  }

  function render(){
    renderStats();
    renderList();
    renderPage();
  }

  searchInput.addEventListener('input', (e)=>{ searchTerm = e.target.value; renderList(); });

  statusTabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    statusFilter = btn.dataset.status;
    [...statusTabs.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  });

  addBtn.addEventListener('click', ()=>{
    mode = 'new';
    selectedId = null;
    pendingDeleteId = null;
    renderPage();
  });

  loadClients();
})();
</script>
</body>
</html>
